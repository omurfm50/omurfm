<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ömür FM internet radyosu">
  <title>ÖMÜR FM</title>
  <style>
    :root {
      color-scheme: dark;
      --black: #000;
      --wine: #770000;
      --deep-wine: #570000;
      --rose: #ff8c8c;
      --red: #dd0000;
      --yellow: #ffff66;
      --blue: #069;
      --silver: #ddd;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--black);
    }

    body {
      min-width: 320px;
      margin: 0;
      padding: 34px;
      overflow-x: auto;
      color: #000;
      background: var(--black);
      font-family: "Times New Roman", Times, serif;
    }

    .site-frame-viewport {
      width: 100%;
    }

    a {
      color: inherit;
    }

    a:hover,
    a:focus-visible {
      filter: brightness(1.22);
      text-shadow: 0 0 5px var(--rose);
    }

    .site-frame {
      width: 100%;
      min-width: 760px;
      margin: 0 auto;
      padding: 10px;
      border: 10px outset #eee;
      border-left-color: #888;
      border-bottom-color: #888;
      background: url("cranberrystrip1cp7.jpg") repeat;
    }

    .site-inner {
      padding: 35px 24px 18px;
      border: 2px solid #111;
      background: var(--black) url("therosestripflutedae7.jpg") repeat-y;
      background-size: 100% auto;
    }

    .panel {
      margin-right: auto;
      margin-left: auto;
      padding: 12px;
      border: 1px solid #ddd;
      background: var(--black) url("therosestrip3ki4.jpg") repeat-y;
      background-size: 100% auto;
    }

    .panel-inner {
      padding: 5px;
      border: 2px inset #eee;
      background: var(--black) url("7ve8.gif") repeat;
    }

    .panel-content {
      padding: 8px;
      background: var(--black) url("borda7eh7.jpg") repeat;
    }

    .nav-panel {
      width: min(740px, 100%);
      padding-top: 12px;
    }

    .brand-banner {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 115px;
      border: 3px double #ddd;
      overflow: hidden;
      color: #ff2a2a;
      background: #000;
      font-family: Georgia, "Times New Roman", Times, serif;
      font-size: 90px;
      font-weight: 700;
      font-style: italic;
      line-height: 1;
      letter-spacing: 3px;
      text-shadow:
        0 2px 0 #720000,
        0 0 7px #f00,
        0 0 18px rgba(255, 0, 0, .9);
      white-space: nowrap;
    }

    .brand-banner span {
      transform: translateY(6px);
      -webkit-text-stroke: 1px #000;
      text-stroke: 1px #000;
    }

    .welcome-panel {
      width: min(740px, 100%);
      margin-top: 46px;
    }

    .welcome {
      margin: 0;
      padding: 7px 18px;
      border: 3px double #ddd;
      background: var(--wine);
      color: var(--rose);
      font-family: "Verdana Ref", "Times New Roman", Times, serif;
      font-size: 40px;
      line-height: 1.25;
      text-align: center;
      white-space: nowrap;
    }

    .dj-ticker {
      width: min(940px, 100%);
      height: 34px;
      margin: 7px auto 0;
      overflow: hidden;
      border: 2px inset #eee;
      color: var(--yellow);
      background: var(--deep-wine);
      font-family: Verdana, Arial, sans-serif;
      font-size: 18px;
      font-weight: 700;
      line-height: 30px;
      white-space: nowrap;
    }

    .dj-ticker-text {
      display: inline-block;
      min-width: 100%;
      padding-left: 100%;
      text-shadow: 0 0 5px var(--rose);
      animation: dj-scroll 20s linear infinite;
    }

    @keyframes dj-scroll {
      to {
        transform: translateX(-100%);
      }
    }

    .player-panel {
      position: relative;
      z-index: 6;
      width: min(940px, 100%);
      margin-top: 6px;
    }

    .player-panel .panel-content {
      padding: 0;
    }

    .player {
      display: grid;
      place-items: center;
      width: 100%;
      height: 554px;
      border: 2px inset #eee;
      background:
        linear-gradient(rgba(0, 0, 0, .18), rgba(0, 0, 0, .18)),
        var(--black) url("borda7eh7.jpg") center / cover;
      color: var(--rose);
      text-align: center;
    }

    .player-status {
      width: 75%;
      padding: 28px;
      border: 3px double var(--rose);
      background: rgba(87, 0, 0, .88);
      font-family: Verdana, Arial, sans-serif;
    }

    .player-status strong {
      display: block;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .player-status span {
      color: #fff;
      font-size: 15px;
    }

    .radio-controls {
      display: flex;
      align-items: center;
      width: min(455px, 100%);
      height: 32px;
      margin: 8px auto 0;
      padding: 3px 7px;
      border: 1px solid #050505;
      border-radius: 2px;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .18),
        0 1px 0 #3c0000;
      background: linear-gradient(#4c4f51, #303234);
      color: #d8d8d8;
      font: 11px Tahoma, Arial, sans-serif;
    }

    .radio-control-button {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-width: 64px;
      height: 22px;
      margin: 0 3px 0 0;
      padding: 0 8px;
      border: 1px solid #080808;
      border-radius: 12px;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .5),
        inset 0 -1px 0 rgba(0, 0, 0, .75),
        0 1px 1px #111;
      background: linear-gradient(#696b6c 0%, #292b2d 48%, #111 52%, #3c3e40 100%);
      color: #d7d7d7;
      font: 700 9px/1 Tahoma, Arial, sans-serif;
      letter-spacing: 1.5px;
      text-shadow: 0 -1px 0 #000;
      cursor: pointer;
    }

    .radio-control-button:hover,
    .radio-control-button:focus-visible {
      outline: 1px solid #9a9a9a;
      outline-offset: 1px;
      filter: brightness(1.2);
    }

    .radio-control-button:active {
      transform: translateY(1px);
      box-shadow: inset 0 2px 3px #080808;
    }

    .control-label {
      transform: translateY(-.5px);
    }

    .play-icon {
      display: block;
      width: 0;
      height: 0;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-left: 8px solid #28df49;
      filter: drop-shadow(0 0 3px rgba(40, 223, 73, .75));
    }

    .stop-icon {
      display: block;
      width: 9px;
      height: 9px;
      border: 1px solid #ff7777;
      border-radius: 1px;
      background: linear-gradient(135deg, #ff4b4b, #a40000);
      box-shadow: 0 0 4px rgba(255, 25, 25, .8);
    }

    .volume-control {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-left: auto;
    }

    .volume-icon {
      width: 22px;
      padding: 0;
      border: 0;
      color: #bfc1c2;
      background: transparent;
      font-size: 16px;
      line-height: 1;
      text-shadow: 0 1px 0 #111;
      cursor: pointer;
    }

    .volume-icon:hover,
    .volume-icon:focus-visible {
      color: #fff;
      outline: 1px solid #777;
    }

    .volume-slider {
      width: 100px;
      height: 14px;
      margin: 0;
      appearance: none;
      border-radius: 2px;
      background: transparent;
      accent-color: #d7d7d7;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-runnable-track {
      height: 5px;
      border: 1px solid #777;
      border-radius: 2px;
      background: #bfc0c1;
    }

    .volume-slider::-webkit-slider-thumb {
      width: 13px;
      height: 13px;
      margin-top: -5px;
      appearance: none;
      border: 1px solid #888;
      border-radius: 50%;
      background: #ddd;
    }

    .volume-slider::-moz-range-track {
      height: 4px;
      border: 1px solid #777;
      border-radius: 2px;
      background: #bfc0c1;
    }

    .volume-slider::-moz-range-thumb {
      width: 11px;
      height: 11px;
      border: 1px solid #888;
      border-radius: 50%;
      background: #ddd;
    }

    .radio-message {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .credits {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin: 16px auto 18px;
      color: #f00;
      font-weight: 700;
      font-style: italic;
      white-space: nowrap;
    }

    .designer {
      color: var(--yellow);
    }

    .year {
      margin-left: 4px;
      color: var(--blue);
    }

    .counter-label {
      margin-left: 8px;
    }

    .counter {
      padding: 1px 4px;
      border: 1px inset #777;
      border-right: 0;
      border-bottom: 0;
      color: #aaa;
      background: #181818;
      font-family: "Courier New", monospace;
      font-style: normal;
      letter-spacing: 2px;
    }

    .heart {
      position: fixed;
      z-index: 5;
      top: -2rem;
      color: #b00000;
      font-size: 18px;
      pointer-events: none;
      text-shadow: 0 0 4px #ff8c8c;
      animation: fall linear infinite;
    }

    @keyframes fall {
      to {
        transform: translate3d(25px, calc(100vh + 4rem), 0) rotate(360deg);
      }
    }

    .mouse-clock {
      position: fixed;
      z-index: 10;
      top: 0;
      left: 0;
      display: none;
      min-width: 78px;
      padding: 4px 7px;
      border: 1px solid #330;
      border-radius: 50%;
      color: #fff;
      background: rgba(0, 0, 0, .78);
      font: 11px Tahoma, Arial, sans-serif;
      text-align: center;
      pointer-events: none;
    }

    .mouse-clock time {
      color: #ff1f1f;
      font-weight: 700;
    }

    .mouse-clock small {
      display: block;
      color: #ff0;
      white-space: nowrap;
    }

    @media (max-width: 800px) {
      body {
        padding: 0;
        overflow-x: hidden;
      }

      .site-frame-viewport {
        position: relative;
        overflow: hidden;
      }

      .site-frame {
        width: 760px;
        min-width: 760px;
        margin: 0;
        transform: scale(var(--mobile-scale, 1));
        transform-origin: top left;
      }

      .mouse-clock {
        display: none !important;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .heart {
        display: none;
      }

      .dj-ticker-text {
        padding-left: 0;
        text-align: center;
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div class="site-frame-viewport">
    <main class="site-frame">
      <div class="site-inner">
      <section class="panel nav-panel" aria-label="Ömür FM logosu">
        <div class="panel-inner">
          <div class="panel-content">
            <div class="brand-banner"><span>ÖMÜR FM</span></div>
          </div>
        </div>
      </section>

      <section class="panel welcome-panel">
        <div class="panel-inner">
          <div class="panel-content">
            <h1 class="welcome">ÖMÜR FM'e HOŞ GELDİNİZ...</h1>
          </div>
        </div>
      </section>

      <div class="dj-ticker" role="marquee" aria-label="Yayındaki DJ">
        <span class="dj-ticker-text">YAYINDA: DJ ......</span>
      </div>

      <section class="panel player-panel" aria-label="Radyo oynatıcı">
        <div class="panel-inner">
          <div class="panel-content">
            <div class="player">
              <div class="player-status">
                <strong>ÖMÜR FM</strong>
                <span>Eski Flatcast yayın servisi çevrimdışı. Yeni yayın adresi eklendiğinde oynatıcı burada çalışacaktır.</span>
              </div>
            </div>
          </div>
        </div>
      </section>

      <div class="radio-controls" role="group" aria-label="Radyo kontrolleri">
        <button class="radio-control-button" id="radio-play" type="button" aria-label="Radyoyu oynat" title="Oynat">
          <span class="control-label" aria-hidden="true">PLAY</span>
          <span class="play-icon" aria-hidden="true"></span>
        </button>
        <button class="radio-control-button" id="radio-stop" type="button" aria-label="Radyoyu durdur" title="Durdur">
          <span class="control-label" aria-hidden="true">STOP</span>
          <span class="stop-icon" aria-hidden="true"></span>
        </button>
        <div class="volume-control">
          <button class="volume-icon" id="radio-mute" type="button" aria-label="Sesi kapat" title="Sesi kapat">&#128266;</button>
          <input class="volume-slider" id="radio-volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Ses seviyesi">
        </div>
        <span class="radio-message" id="radio-message" role="status" aria-live="polite"></span>
        <audio id="radio-audio" preload="none" autoplay></audio>
      </div>

      <footer class="credits">
        <span>Web Tasarım :</span>
        <span class="designer">SeLoCaN</span>
        <span class="year">2026 ©</span>
        <span class="counter-label">Ziyaretçi Sayısı :</span>
        <output class="counter" id="visitor-count">000001</output>
      </footer>

      </div>
    </main>
  </div>

  <div class="mouse-clock" id="mouse-clock" aria-hidden="true">
    <time id="clock-time"></time>
    <small id="clock-date"></small>
  </div>

  <script>
    (() => {
      const clock = document.querySelector("#mouse-clock");
      const clockTime = document.querySelector("#clock-time");
      const clockDate = document.querySelector("#clock-date");
      const counter = document.querySelector("#visitor-count");
      const radioAudio = document.querySelector("#radio-audio");
      const radioPlay = document.querySelector("#radio-play");
      const radioStop = document.querySelector("#radio-stop");
      const radioMute = document.querySelector("#radio-mute");
      const radioVolume = document.querySelector("#radio-volume");
      const radioMessage = document.querySelector("#radio-message");
      const frameViewport = document.querySelector(".site-frame-viewport");
      const siteFrame = document.querySelector(".site-frame");
      const mobileLayout = window.matchMedia("(max-width: 800px)");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      const syncMobileLayout = () => {
        if (!mobileLayout.matches) {
          document.documentElement.style.removeProperty("--mobile-scale");
          frameViewport.style.removeProperty("height");
          return;
        }

        const scale = Math.min(1, document.documentElement.clientWidth / 760);
        document.documentElement.style.setProperty("--mobile-scale", String(scale));
        frameViewport.style.height = `${siteFrame.offsetHeight * scale}px`;
      };

      syncMobileLayout();
      window.addEventListener("resize", syncMobileLayout, { passive: true });

      const updateClock = () => {
        const now = new Date();
        clockTime.textContent = new Intl.DateTimeFormat("tr-TR", {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        }).format(now);
        clockDate.textContent = new Intl.DateTimeFormat("tr-TR", {
          weekday: "short",
          day: "numeric",
          month: "short"
        }).format(now);
      };

      updateClock();
      window.setInterval(updateClock, 1000);

      radioAudio.volume = Number(radioVolume.value);

      radioPlay.addEventListener("click", async () => {
        if (!radioAudio.currentSrc && !radioAudio.getAttribute("src")) {
          radioMessage.textContent = "Yayın bağlantısı henüz eklenmedi.";
          return;
        }

        try {
          await radioAudio.play();
          radioMessage.textContent = "Radyo oynatılıyor.";
        } catch {
          radioMessage.textContent = "Radyo yayını başlatılamadı.";
        }
      });

      radioStop.addEventListener("click", () => {
        radioAudio.pause();
        radioAudio.currentTime = 0;
        radioMessage.textContent = "Radyo durduruldu.";
      });

      radioMute.addEventListener("click", () => {
        radioAudio.muted = !radioAudio.muted;
        radioMute.innerHTML = radioAudio.muted ? "&#128263;" : "&#128266;";
        radioMute.setAttribute("aria-label", radioAudio.muted ? "Sesi aç" : "Sesi kapat");
        radioMute.title = radioAudio.muted ? "Sesi aç" : "Sesi kapat";
        radioMessage.textContent = radioAudio.muted ? "Ses kapatıldı." : "Ses açıldı.";
      });

      radioVolume.addEventListener("input", () => {
        radioAudio.volume = Number(radioVolume.value);
      });

      if (!reduceMotion && window.matchMedia("(pointer: fine)").matches) {
        document.addEventListener("mousemove", (event) => {
          clock.style.display = "block";
          clock.style.transform = `translate(${event.clientX + 22}px, ${event.clientY + 18}px)`;
        }, { passive: true });

        for (let index = 0; index < 10; index += 1) {
          const heart = document.createElement("span");
          heart.className = "heart";
          heart.textContent = "♥";
          heart.style.left = `${Math.random() * 100}vw`;
          heart.style.animationDuration = `${7 + Math.random() * 8}s`;
          heart.style.animationDelay = `${Math.random() * -12}s`;
          heart.style.opacity = String(0.35 + Math.random() * 0.55);
          document.body.append(heart);
        }
      }

      try {
        const key = "omur-fm-visitor-count";
        const visits = Number.parseInt(localStorage.getItem(key) || "0", 10) + 1;
        localStorage.setItem(key, String(visits));
        counter.value = String(visits).padStart(6, "0");
      } catch {
        counter.value = "000001";
      }
    })();
  </script>
</body>
</html>
